
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMS Logs - QR Attendance System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        .sms-container { max-width: 1000px; margin: 0 auto; padding: 15px; }
        .nav-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; padding: 12px; background: #1e1e2e; border-radius: 10px; justify-content: center; }
        .nav-bar a { padding: 8px 14px; background: #2a2a3e; color: #ccc; text-decoration: none; border-radius: 6px; font-size: 0.8em; transition: all 0.2s; white-space: nowrap; }
        .nav-bar a:hover, .nav-bar a.active { background: #00b894; color: white; }
        .nav-bar a.logout-btn { background: #ff6b6b33; color: #ff6b6b; }
        .nav-bar a.logout-btn:hover { background: #ff6b6b; color: white; }
        .page-header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .page-header h1 { font-size: 1.3em; color: #00b894; margin-bottom: 5px; }
        .page-header p { color: #888; font-size: 0.85em; }
        .logs-section { background: #1e1e2e; padding: 20px; border-radius: 12px; }
        .logs-section h2 { color: #00b894; font-size: 1em; margin-bottom: 15px; }
        .table-wrapper { overflow-x: auto; }
        .logs-table { width: 100%; border-collapse: collapse; }
        .logs-table th { background: #16213e; color: #00b894; padding: 10px 12px; text-align: left; font-size: 0.8em; }
        .logs-table td { padding: 10px 12px; border-bottom: 1px solid #333; color: #ddd; font-size: 0.8em; }
        .logs-table tr:hover { background: #2a2a3e; }
        .status-sent { color: #00b894; font-weight: bold; }
        .status-failed { color: #ff6b6b; font-weight: bold; }
        .status-mock { color: #ffd93d; font-weight: bold; }
        @media (max-width: 768px) { .nav-bar a { padding: 7px 10px; font-size: 0.75em; } }
        @media (max-width: 480px) { .sms-container { padding: 10px; } .nav-bar { gap: 5px; } .nav-bar a { padding: 6px 8px; font-size: 0.7em; } }
    </style>
</head>
<body>
    <div class="sms-container">
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Scan QR</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html" class="active">SMS Logs</a>
            <a href="manage-users.html">Manage Users</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>

        <div class="page-header">
            <h1>SMS Notification Logs</h1>
            <p>View all sent SMS notifications to parents/guardians</p>
        </div>

        <div class="logs-section">
            <h2>SMS History</h2>
            <div class="table-wrapper">
                <table class="logs-table">
                    <thead><tr><th>#</th><th>Student</th><th>Phone</th><th>Message</th><th>Status</th><th>Date</th></tr></thead>
                    <tbody id="logsTableBody"><tr><td colspan="6" style="text-align:center; color:#888;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('token');
        var user = null;
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }
        if (!token) { window.location.href = 'index.html'; }

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        async function loadLogs() {
            var tbody = document.getElementById('logsTableBody');
            try {
                var response = await fetch('/api/sms/logs', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">Could not load SMS logs. Server may be starting up.</td></tr>';
                    return;
                }
                var logs = await response.json();
                if (!logs || logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">No SMS notifications sent yet.</td></tr>';
                    return;
                }
                var html = '';
                for (var i = 0; i < logs.length; i++) {
                    var l = logs[i];
                    var statusClass = l.status === 'sent' ? 'status-sent' : l.status === 'mock' ? 'status-mock' : 'status-failed';
                    var date = '-';
                    if (l.created_at) { try { date = new Date(l.created_at).toLocaleString(); } catch(e) { date = l.created_at; } }
                    html += '<tr>';
                    html += '<td>' + (i+1) + '</td>';
                    html += '<td>' + (l.student_name || '-') + '</td>';
                    html += '<td>' + (l.phone_number || '-') + '</td>';
                    html += '<td>' + (l.message || '-') + '</td>';
                    html += '<td><span class="' + statusClass + '">' + (l.status || '-').toUpperCase() + '</span></td>';
                    html += '<td>' + date + '</td>';
                    html += '</tr>';
                }
                tbody.innerHTML = html;
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">Connection error. Please refresh.</td></tr>';
            }
        }

        loadLogs();
    </script>
</body>
</html>
