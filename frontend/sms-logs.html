
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMS Logs - QR Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fff5f7;
            color: #333;
            padding: 15px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .section-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 10px rgba(219, 112, 147, 0.1);
        }
        .section-card h2 {
            color: #880e4f;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .stat-box {
            background: #fff5f7;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #fce4ec;
        }
        .stat-box .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #880e4f;
        }
        .stat-box .stat-label {
            font-size: 0.75em;
            color: #888;
            margin-top: 5px;
        }
        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-row input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 2px solid #fce4ec;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .filter-row input:focus {
            border-color: #e91e63;
            outline: none;
        }
        .filter-row button {
            padding: 10px 20px;
            background: #880e4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .filter-row button:hover {
            background: #ad1457;
        }
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        th {
            background: #fce4ec;
            color: #880e4f;
            padding: 10px 8px;
            text-align: left;
            font-size: 0.8em;
            position: sticky;
            top: 0;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #fce4ec;
        }
        tr:hover {
            background: #fff5f7;
        }
        .status-sent {
            color: #2e7d32;
            font-weight: bold;
        }
        .status-no-contact {
            color: #e65100;
            font-weight: bold;
        }
        .status-failed {
            color: #c62828;
            font-weight: bold;
        }
        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        .msg-cell {
            max-width: 250px;
            word-wrap: break-word;
            font-size: 0.8em;
        }
        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            table {
                font-size: 0.75em;
            }
            th, td {
                padding: 6px 4px;
            }
            .msg-cell {
                max-width: 150px;
            }
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="attendance.html">Attendance</a>
            <a href="students.html">Students</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html" class="active">SMS Logs</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>

        <div class="section-card">
            <h2>SMS Notification Summary</h2>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-value" id="totalSMS">0</div>
                    <div class="stat-label">Total SMS Sent</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="sentCount">0</div>
                    <div class="stat-label">Successfully Sent</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="noContactCount">0</div>
                    <div class="stat-label">No Contact</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="todayCount">0</div>
                    <div class="stat-label">Sent Today</div>
                </div>
            </div>
        </div>

        <div class="section-card">
            <h2>SMS Notification Logs</h2>
            <div class="filter-row">
                <input type="text" id="searchInput" placeholder="Search by student name..." oninput="filterLogs()">
                <button onclick="loadLogs()">Refresh</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Student</th>
                            <th>Guardian Contact</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Date/Time</th>
                        </tr>
                    </thead>
                    <tbody id="logsBody">
                        <tr><td colspan="6" class="no-data">Loading SMS logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
        }
        var user = null;
        try {
            user = JSON.parse(localStorage.getItem('user') || '{}');
        } catch(e) {
            user = {};
        }

        var allLogs = [];

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }

        function filterLogs() {
            var search = document.getElementById('searchInput').value.toLowerCase().trim();
            var filtered = allLogs;
            if (search) {
                filtered = allLogs.filter(function(log) {
                    return (log.full_name || '').toLowerCase().indexOf(search) !== -1;
                });
            }
            renderLogs(filtered);
        }

        function renderLogs(logs) {
            var tbody = document.getElementById('logsBody');
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No SMS logs found. Logs will appear when attendance is recorded for students with guardian contacts.</td></tr>';
                return;
            }
            var html = '';
            for (var i = 0; i < logs.length; i++) {
                var log = logs[i];
                var statusClass = 'status-no-contact';
                var statusText = 'No Contact';
                if (log.status === 'sent') {
                    statusClass = 'status-sent';
                    statusText = 'Sent';
                } else if (log.status === 'failed') {
                    statusClass = 'status-failed';
                    statusText = 'Failed';
                }
                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td>' + (log.full_name || 'Unknown') + '</td>';
                html += '<td>' + (log.guardian_contact || 'N/A') + '</td>';
                html += '<td class="msg-cell">' + (log.message || '') + '</td>';
                html += '<td class="' + statusClass + '">' + statusText + '</td>';
                html += '<td>' + (log.created_at || '') + '</td>';
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }

        function updateStats(logs) {
            var total = logs.length;
            var sent = 0;
            var noContact = 0;
            var today = new Date().toISOString().split('T')[0];
            var todayCount = 0;

            for (var i = 0; i < logs.length; i++) {
                if (logs[i].status === 'sent') {
                    sent++;
                } else {
                    noContact++;
                }
                if (logs[i].created_at && logs[i].created_at.indexOf(today) !== -1) {
                    todayCount++;
                }
            }

            document.getElementById('totalSMS').textContent = total;
            document.getElementById('sentCount').textContent = sent;
            document.getElementById('noContactCount').textContent = noContact;
            document.getElementById('todayCount').textContent = todayCount;
        }

        async function loadLogs() {
            try {
                var response = await fetch('/api/sms/logs', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!response.ok) {
                    if (response.status === 401) {
                        document.getElementById('logsBody').innerHTML = '<tr><td colspan="6" class="no-data">Session expired. Please login again.</td></tr>';
                        return;
                    }
                    document.getElementById('logsBody').innerHTML = '<tr><td colspan="6" class="no-data">Failed to load SMS logs</td></tr>';
                    return;
                }
                var logs = await response.json();
                allLogs = logs;
                updateStats(logs);
                renderLogs(logs);
            } catch (err) {
                console.log('Load logs error:', err);
                document.getElementById('logsBody').innerHTML = '<tr><td colspan="6" class="no-data">Error loading SMS logs. Server may be starting up.</td></tr>';
            }
        }

        loadLogs();
    </script>
</body>
</html>
