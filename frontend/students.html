
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - QR Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .students-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .students-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .students-header h1 { font-size: 1.5em; margin-bottom: 5px; }
        .students-header p { opacity: 0.8; font-size: 0.9em; }

        .nav-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; background: #1e1e2e; border-radius: 10px; justify-content: center; }
        .nav-bar a { padding: 8px 16px; background: #2a2a3e; color: #ccc; text-decoration: none; border-radius: 6px; font-size: 0.85em; transition: all 0.2s; }
        .nav-bar a:hover, .nav-bar a.active { background: #00b894; color: white; }

        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background: #2a2a3e; color: white; font-size: 0.9em; }
        .search-box:focus { border-color: #00b894; outline: none; }
        .filter-select { padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background: #2a2a3e; color: white; font-size: 0.9em; }
        .btn-print-all { padding: 10px 20px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
        .btn-print-all:hover { transform: scale(1.05); }

        .students-table-wrapper { background: #1e1e2e; border-radius: 12px; overflow: hidden; }
        .students-count { color: #888; font-size: 0.85em; padding: 15px 20px 5px 20px; }
        .students-table { width: 100%; border-collapse: collapse; }
        .students-table th { background: #16213e; color: #00b894; padding: 12px 15px; text-align: left; font-size: 0.85em; }
        .students-table td { padding: 10px 15px; border-bottom: 1px solid #333; color: #ddd; font-size: 0.85em; }
        .students-table tr:hover { background: #2a2a3e; }

        .gender-badge { padding: 3px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
        .gender-badge.male { background: #74b9ff33; color: #74b9ff; }
        .gender-badge.female { background: #fd79a833; color: #fd79a8; }

        .btn-qr { padding: 5px 12px; background: #00b894; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .btn-qr:hover { background: #00a884; }

        .qr-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .qr-modal-content { background: #1e1e2e; padding: 30px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%; }
        .qr-modal-content h3 { color: #00b894; margin-bottom: 5px; }
        .qr-modal-content p { color: #888; font-size: 0.85em; margin-bottom: 15px; }
        .qr-modal-content img { max-width: 200px; margin: 10px auto; display: block; }
        .btn-close-modal { padding: 10px 25px; background: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 0.9em; }
        .btn-print-qr { padding: 10px 25px; background: #6c5ce7; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="students-container">
        <!-- Navigation -->
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html" class="active">Students</a>
            <a href="attendance.html">Scan QR</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html">SMS Logs</a>
            <a href="manage-users.html">Manage Users</a>
            <a href="index.html" onclick="localStorage.clear()">Logout</a>
        </div>

        <!-- Header -->
        <div class="students-header">
            <h1>Student Management</h1>
            <p>Sta. Rosa ES - Grade 6 Great Geniuses</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="Search students by name...">
            <select class="filter-select" id="genderFilter">
                <option value="all">All Genders</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
            <button class="btn-print-all" onclick="printAllQR()">Print All QR Codes</button>
        </div>

        <!-- Students Table -->
        <div class="students-table-wrapper">
            <p class="students-count" id="studentsCount">Loading...</p>
            <table class="students-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Guardian</th>
                        <th>Contact</th>
                        <th>QR Code</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#888;">Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- QR Modal -->
    <div class="qr-modal" id="qrModal">
        <div class="qr-modal-content">
            <h3 id="modalStudentName"></h3>
            <p id="modalStudentInfo"></p>
            <div id="modalQRCode"></div>
            <button class="btn-print-qr" onclick="printQR()">Print QR Code</button>
            <button class="btn-close-modal" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        let allStudents = [];

        async function loadStudents() {
            try {
                const response = await fetch('/api/students', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed');
                allStudents = await response.json();
                renderStudents(allStudents);
            } catch (err) {
                console.error('Load students error:', err);
                document.getElementById('studentsTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ff6b6b;">Failed to load students.</td></tr>';
            }
        }

        function renderStudents(students) {
            document.getElementById('studentsCount').textContent = `Showing ${students.length} student(s)`;
            const tbody = document.getElementById('studentsTableBody');

            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">No students found.</td></tr>';
                return;
            }

            tbody.innerHTML = students.map((s, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${s.last_name}, ${s.first_name} ${s.middle_name || ''}</strong></td>
                    <td><span class="gender-badge ${(s.gender || '').toLowerCase()}">${s.gender}</span></td>
                    <td>${s.guardian_name || '-'}</td>
                    <td>${s.guardian_phone || '-'}</td>
                    <td><button class="btn-qr" onclick="showQR(${s.id}, '${s.first_name} ${s.last_name}', '${s.gender}')">View QR</button></td>
                </tr>
            `).join('');
        }

        // Search
        document.getElementById('searchBox').addEventListener('input', filterStudents);
        document.getElementById('genderFilter').addEventListener('change', filterStudents);

        function filterStudents() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const gender = document.getElementById('genderFilter').value;
            let filtered = allStudents;

            if (search) {
                filtered = filtered.filter(s =>
                    (s.first_name + ' ' + s.last_name + ' ' + (s.middle_name || '')).toLowerCase().includes(search)
                );
            }
            if (gender !== 'all') {
                filtered = filtered.filter(s => s.gender === gender);
            }
            renderStudents(filtered);
        }

        // QR Modal
        function showQR(id, name, gender) {
            document.getElementById('modalStudentName').textContent = name;
            document.getElementById('modalStudentInfo').textContent = `${gender} | Sta. Rosa ES - Grade 6 Great Geniuses`;
            const qrDiv = document.getElementById('modalQRCode');
            qrDiv.innerHTML = '';
            new QRCode(qrDiv, {
                text: name,
                width: 200,
                height: 200,
                colorDark: '#1a1a2e',
                colorLight: '#ffffff'
            });
            document.getElementById('qrModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        function printQR() {
            const name = document.getElementById('modalStudentName').textContent;
            const info = document.getElementById('modalStudentInfo').textContent;
            const qrImg = document.querySelector('#modalQRCode img');
            if (!qrImg) return;

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html><head><title>QR Code - ${name}</title>
                <style>body{text-align:center;font-family:Arial;padding:20px;}h2{margin-bottom:5px;}p{color:#666;}</style>
                </head><body>
                <h2>${name}</h2><p>${info}</p>
                <img src="${qrImg.src}" width="200" height="200">
                <script>window.print();window.close();<\/script>
                </body></html>
            `);
        }

        function printAllQR() {
            const printWindow = window.open('', '_blank');
            let html = `<html><head><title>All QR Codes</title>
                <style>body{font-family:Arial;}.qr-item{display:inline-block;text-align:center;margin:15px;padding:10px;border:1px solid #ccc;border-radius:8px;width:220px;}h3{font-size:0.9em;margin:5px 0;}p{font-size:0.8em;color:#666;margin:3px 0;}</style>
                </head><body><h1 style="text-align:center;">QR Codes - Grade 6 Great Geniuses</h1><div style="text-align:center;">`;

            allStudents.forEach(s => {
                html += `<div class="qr-item"><h3>${s.last_name}, ${s.first_name}</h3><p>${s.gender}</p><div id="qr-${s.id}"></div></div>`;
            });

            html += `</div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"><\/script><script>`;
            allStudents.forEach(s => {
                html += `new QRCode(document.getElementById('qr-${s.id}'),{text:'${s.first_name} ${s.last_name}',width:150,height:150});`;
            });
            html += `setTimeout(function(){window.print();},2000);<\/script></body></html>`;

            printWindow.document.write(html);
        }

        loadStudents();
    </script>
</body>
</html>
