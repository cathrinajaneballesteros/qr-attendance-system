
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Students - QR Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .section-card h2 { color: #880e4f; margin-bottom: 15px; font-size: 1.1em; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #fce4ec; color: #880e4f; padding: 10px 8px; text-align: left; font-size: 0.8em; }
        td { padding: 8px; border-bottom: 1px solid #fce4ec; }
        tr:hover { background: #fff5f7; }
        .print-btn { padding: 10px 20px; background: #880e4f; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .print-btn:hover { background: #ad1457; }
        @media (max-width: 480px) { table { font-size: 0.75em; } th, td { padding: 6px 4px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="attendance.html">Attendance</a>
            <a href="students.html" class="active">Students</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html">SMS Logs</a>
            <a href="settings.html">Attendance Settings</a><a href="records.html">Download Records</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>
        <div class="section-card">
            <h2>Student List - Grade 6 Great Geniuses (S.Y. 2026-2027)</h2>
            <button class="print-btn" onclick="window.open('print-qr.html','_blank')">Download QR Code ID Cards</button>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>No.</th><th>Full Name</th><th>Sex</th><th>QR Code</th><th>Guardian Contact</th></tr></thead>
                    <tbody id="studentsBody"><tr><td colspan="5" class="no-data">Loading students...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; }

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        async function loadStudents() {
            try {
                var response = await fetch('/api/students', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) {
                    document.getElementById('studentsBody').innerHTML = '<tr><td colspan="5" class="no-data">Failed to load students</td></tr>';
                    return;
                }
                var students = await response.json();
                var tbody = document.getElementById('studentsBody');
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="no-data">No students found</td></tr>';
                    return;
                }
                var html = '';
                for (var i = 0; i < students.length; i++) {
                    var s = students[i];
                    html += '<tr><td>' + (i + 1) + '</td><td>' + s.full_name + '</td><td>' + (s.sex || '') + '</td><td>' + (s.qr_code || '') + '</td><td>' + (s.guardian_contact || '') + '</td></tr>';
                }
                tbody.innerHTML = html;
            } catch (err) {
                document.getElementById('studentsBody').innerHTML = '<tr><td colspan="5" class="no-data">Failed to load students</td></tr>';
            }
        }
        loadStudents();
    </script>
</body>
</html>
