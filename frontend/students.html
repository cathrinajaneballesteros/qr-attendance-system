
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Students - QR Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 15px; }
        .students-container { max-width: 1000px; margin: 0 auto; }
        .add-section { background: #fff; padding: 25px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .add-section h2 { color: #c2185b; font-size: 1.1em; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .form-grid .form-group label { display: block; color: #666; font-size: 0.8em; margin-bottom: 5px; font-weight: bold; }
        .form-grid .form-group input, .form-grid .form-group select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #f8bbd0; background: #fff5f7; color: #333; font-size: 0.9em; }
        .form-grid .form-group input:focus, .form-grid .form-group select:focus { border-color: #e91e63; outline: none; }
        .btn-add { background: linear-gradient(135deg, #e91e63, #ec407a); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        .btn-add:hover { transform: scale(1.02); }
        .add-result { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85em; display: none; }
        .add-result.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .add-result.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        .list-section { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .list-section h2 { color: #c2185b; font-size: 1em; margin-bottom: 15px; }
        .student-table { width: 100%; border-collapse: collapse; }
        .student-table th { background: #fce4ec; color: #c2185b; padding: 10px 12px; text-align: left; font-size: 0.8em; }
        .student-table td { padding: 10px 12px; border-bottom: 1px solid #fce4ec; color: #555; font-size: 0.8em; }
        .student-table tr:hover { background: #fff5f7; }
        .gender-badge { padding: 2px 10px; border-radius: 10px; font-size: 0.75em; font-weight: bold; }
        .gender-badge.male { background: #e3f2fd; color: #1565c0; }
        .gender-badge.female { background: #fce4ec; color: #c2185b; }
        .btn-delete { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75em; font-weight: bold; }
        .btn-delete:hover { background: #c62828; color: white; }
        .actions-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="students-container">
        <div class="nav-bar" id="navBar"></div>

        <div class="add-section">
            <h2>Add New Student</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" placeholder="First Name" required>
                </div>
                <div class="form-group">
                    <label>Middle Name</label>
                    <input type="text" id="middleName" placeholder="Middle Name">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">-- Select --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>LRN</label>
                    <input type="text" id="lrn" placeholder="Learner Reference Number">
                </div>
                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" id="guardianName" placeholder="Guardian Name">
                </div>
                <div class="form-group">
                    <label>Guardian Phone</label>
                    <input type="text" id="guardianPhone" placeholder="09XXXXXXXXX">
                </div>
            </div>
            <button class="btn-add" onclick="addStudent()">Add Student</button>
            <div class="add-result" id="addResult"></div>
        </div>

        <div class="list-section">
            <h2>All Students - Grade 6 Great Geniuses</h2>
            <div class="actions-row">
                <a href="print-qr.html" class="btn-add" style="text-decoration:none; font-size:0.85em; padding:8px 18px;">Download QR Codes</a>
            </div>
            <div class="table-wrapper">
                <table class="student-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Gender</th>
                            <th>LRN</th>
                            <th>Guardian</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="7" class="no-data">Loading students...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('token');
        var user = null;
        if (!token) { window.location.href = 'index.html'; }
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }

        function buildNav() {
            var nav = document.getElementById('navBar');
            var html = '';
            html += '<a href="dashboard.html">Dashboard</a>';
            html += '<a href="students.html" class="active">Students</a>';
            html += '<a href="attendance.html">Scan QR</a>';
            html += '<a href="sf2-report.html">SF2 Report</a>';
            html += '<a href="sms-logs.html">SMS Logs</a>';
            if (user && user.role === 'admin') {
                html += '<a href="manage-users.html">Manage Users</a>';
            }
            html += '<a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>';
            nav.innerHTML = html;
        }
        buildNav();

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        async function addStudent() {
            var firstName = document.getElementById('firstName').value.trim();
            var middleName = document.getElementById('middleName').value.trim();
            var lastName = document.getElementById('lastName').value.trim();
            var gender = document.getElementById('gender').value;
            var lrn = document.getElementById('lrn').value.trim();
            var guardianName = document.getElementById('guardianName').value.trim();
            var guardianPhone = document.getElementById('guardianPhone').value.trim();
            var resultDiv = document.getElementById('addResult');

            if (!firstName || !lastName || !gender) {
                resultDiv.className = 'add-result error';
                resultDiv.textContent = 'First name, last name, and gender are required.';
                resultDiv.style.display = 'block';
                return;
            }

            try {
                var response = await fetch('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ first_name: firstName, middle_name: middleName, last_name: lastName, gender: gender, lrn: lrn, guardian_name: guardianName, guardian_phone: guardianPhone })
                });

                var data = await response.json();
                if (response.ok) {
                    resultDiv.className = 'add-result success';
                    resultDiv.textContent = 'Student ' + firstName + ' ' + lastName + ' added successfully!';
                    resultDiv.style.display = 'block';
                    document.getElementById('firstName').value = '';
                    document.getElementById('middleName').value = '';
                    document.getElementById('lastName').value = '';
                    document.getElementById('gender').value = '';
                    document.getElementById('lrn').value = '';
                    document.getElementById('guardianName').value = '';
                    document.getElementById('guardianPhone').value = '';
                    loadStudents();
                } else {
                    resultDiv.className = 'add-result error';
                    resultDiv.textContent = data.error || 'Failed to add student.';
                    resultDiv.style.display = 'block';
                }
            } catch (err) {
                resultDiv.className = 'add-result error';
                resultDiv.textContent = 'Connection error. Please try again.';
                resultDiv.style.display = 'block';
            }
        }

        async function loadStudents() {
            var tbody = document.getElementById('studentsTableBody');
            try {
                var response = await fetch('/api/students', { headers: { 'Authorization': 'Bearer ' + token } });
                if (response.status === 401) { localStorage.clear(); window.location.href = 'index.html'; return; }
                if (!response.ok) { tbody.innerHTML = '<tr><td colspan="7" class="no-data">Could not load students.</td></tr>'; return; }
                var students = await response.json();
                if (!students || students.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="no-data">No students enrolled yet.</td></tr>'; return; }

                var males = students.filter(function(s) { return s.gender === 'Male'; });
                var females = students.filter(function(s) { return s.gender === 'Female'; });
                males.sort(function(a, b) { return a.last_name.localeCompare(b.last_name); });
                females.sort(function(a, b) { return a.last_name.localeCompare(b.last_name); });
                var sorted = males.concat(females);

                var html = '';
                for (var i = 0; i < sorted.length; i++) {
                    var s = sorted[i];
                    var fullName = s.last_name + ', ' + s.first_name + (s.middle_name ? ' ' + s.middle_name : '');
                    var genderClass = s.gender === 'Male' ? 'male' : 'female';
                    html += '<tr>';
                    html += '<td>' + (i + 1) + '</td>';
                    html += '<td>' + fullName + '</td>';
                    html += '<td><span class="gender-badge ' + genderClass + '">' + s.gender + '</span></td>';
                    html += '<td>' + (s.lrn || '-') + '</td>';
                    html += '<td>' + (s.guardian_name || '-') + '</td>';
                    html += '<td>' + (s.guardian_phone || '-') + '</td>';
                    html += '<td><button class="btn-delete" onclick="deleteStudent(' + s.id + ', \'' + fullName.replace(/'/g, "\\'") + '\')">Delete</button></td>';
                    html += '</tr>';
                }
                tbody.innerHTML = html;
            } catch (err) { tbody.innerHTML = '<tr><td colspan="7" class="no-data">Could not load students.</td></tr>'; }
        }

        async function deleteStudent(id, name) {
            if (!confirm('Are you sure you want to delete ' + name + '?')) return;
            try {
                var response = await fetch('/api/students/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (response.ok) { loadStudents(); }
                else { alert('Failed to delete student.'); }
            } catch (err) { alert('Connection error.'); }
        }

        loadStudents();
    </script>
</body>
</html>
