
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Attendance System - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-container { background: white; padding: 40px 35px; border-radius: 16px; box-shadow: 0 10px 40px rgba(233,30,99,0.15); width: 100%; max-width: 380px; text-align: center; }
        .login-logo { margin-bottom: 8px; }
        .login-logo h1 { font-size: 1.8em; color: #333; margin: 0; }
        .login-logo h1 span { color: #e91e63; }
        .login-subtitle { color: #888; font-size: 0.8em; margin-bottom: 5px; }
        .login-school { color: #c2185b; font-weight: bold; font-size: 0.85em; margin-bottom: 3px; }
        .login-section { color: #999; font-size: 0.75em; margin-bottom: 25px; }
        .error-msg { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; font-size: 0.85em; margin-bottom: 15px; display: none; border: 1px solid #ffcdd2; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; color: #666; font-size: 0.85em; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #f8bbd0; background: #fff5f7; color: #333; font-size: 0.95em; box-sizing: border-box; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #e91e63; outline: none; background: #fff; }
        .btn-login { width: 100%; padding: 13px; background: linear-gradient(135deg, #e91e63, #ec407a); color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(233,30,99,0.3); }
        .btn-login:disabled { opacity: 0.6; pointer-events: none; }
        @media (max-width: 480px) { .login-container { margin: 15px; padding: 30px 25px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <h1>QR<span>Attend</span></h1>
        </div>
        <div class="login-subtitle">QR Attendance System with Parent Notification</div>
        <div class="login-school">Sta. Rosa Elementary School</div>
        <div class="login-section">Grade 6 - Great Geniuses | S.Y. 2026-2027</div>

        <div class="error-msg" id="errorMsg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>
    </div>

    <script>
        // Clear any stored data on login page load (security)
        localStorage.removeItem('token');
        localStorage.removeItem('user');

        // Make sure fields are empty on page load
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';

        async function handleLogin(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorMsg = document.getElementById('errorMsg');
            var loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                errorMsg.textContent = 'Please enter both username and password.';
                errorMsg.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorMsg.style.display = 'none';

            try {
                var response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                var data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect based on role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    errorMsg.textContent = data.error || 'Invalid username or password.';
                    errorMsg.style.display = 'block';
                    // Clear password field on failed login
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Is the server running?';
                errorMsg.style.display = 'block';
            }

            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    </script>
</body>
</html>
