
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Attendance System - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { background: #1e1e2e; padding: 40px 35px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { color: white; font-size: 1.5em; margin-bottom: 5px; }
        .login-header .brand { color: #00b894; font-size: 1.8em; font-weight: bold; margin-bottom: 8px; }
        .login-header .brand span { color: #ff6b6b; }
        .login-header p { color: #888; font-size: 0.85em; }
        .login-header .school { color: #ccc; font-size: 0.9em; margin-top: 8px; font-weight: bold; }
        .login-header .section { color: #888; font-size: 0.8em; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #ccc; font-size: 0.85em; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #2a2a3e; color: white; font-size: 0.95em; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #00b894; outline: none; }
        .form-group input::placeholder { color: #555; }
        .btn-login { width: 100%; padding: 13px; background: linear-gradient(135deg, #00b894, #00cec9); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; transition: transform 0.2s; }
        .btn-login:hover { transform: scale(1.02); }
        .btn-login:disabled { opacity: 0.6; pointer-events: none; }
        .error-msg { background: #ff6b6b22; color: #ff6b6b; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; border: 1px solid #ff6b6b44; display: none; font-size: 0.85em; }
        .default-accounts { margin-top: 20px; padding: 15px; background: #2a2a3e; border-radius: 8px; }
        .default-accounts h3 { color: #888; font-size: 0.8em; margin-bottom: 8px; }
        .default-accounts p { color: #666; font-size: 0.75em; margin-bottom: 4px; }
        @media (max-width: 480px) { .login-container { padding: 30px 25px; } .login-header .brand { font-size: 1.5em; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="brand">QR<span>Attend</span></div>
            <h1>QR Attendance System with Parent Notification</h1>
            <p class="school">Sta. Rosa Elementary School</p>
            <p class="section">Grade 6 - Great Geniuses | S.Y. 2025-2026</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

      
    </div>

    <script>
        // If already logged in, go to dashboard
        var existingToken = localStorage.getItem('token');
        if (existingToken) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorMsg = document.getElementById('errorMsg');
            var loginBtn = document.getElementById('loginBtn');

            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                var response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                var data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Invalid username or password.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. The server may be starting up. Please try again in a moment.';
                errorMsg.style.display = 'block';
            }

            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        });
    </script>
</body>
</html>
