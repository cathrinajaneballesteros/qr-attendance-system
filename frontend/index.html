<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Attendance System - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fce4ec 0%,#f8bbd0 50%,#f48fb1 100%);padding:20px}
    .login-card{background:#fff;border-radius:20px;padding:40px 35px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(136,14,79,.15)}
    .login-header{text-align:center;margin-bottom:30px}
    .login-header h1{font-size:1.8em;margin-bottom:5px}
    .login-header h1 span.qr{color:#880e4f}
    .login-header h1 span.attend{color:#e91e63}
    .login-header p{color:#888;font-size:.8em;margin-top:5px}
    .login-header .school-name{color:#880e4f;font-weight:bold;font-size:.85em;margin-top:8px}
    .login-header .section-info{color:#999;font-size:.75em}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;color:#666;font-size:.8em;margin-bottom:6px;font-weight:600}
    .form-group input{width:100%;padding:12px 16px;border:2px solid #fce4ec;border-radius:10px;font-size:.95em;background:#fff5f7;color:#333}
    .form-group input:focus{border-color:#e91e63;outline:none;background:#fff}
    .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#880e4f,#ad1457);color:#fff;border:0;border-radius:10px;font-size:1em;font-weight:bold;cursor:pointer}
    .btn-login:disabled{opacity:.65;cursor:wait}
    .error-msg{background:#ffebee;color:#b71c1c;padding:10px 15px;border-radius:8px;font-size:.85em;margin-bottom:15px;border:1px solid #ffcdd2;text-align:center}
    .error-msg[hidden]{display:none}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1><span class="qr">QR</span><span class="attend">Attend</span></h1>
      <p>QR Attendance System with Parent Notification</p>
      <div class="school-name">Sta. Rosa Elementary School</div>
      <div class="section-info">Grade 6 - Great Geniuses | S.Y. 2026-2027</div>
    </div>

    <div id="errorMsg" class="error-msg" role="alert" aria-live="polite" hidden></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="student_login_user"
          autocomplete="off"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="student_login_password"
          autocomplete="new-password"
          required
        >
      </div>

      <button class="btn-login" id="loginButton" type="submit">Sign In</button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginButton = document.getElementById('loginButton');

    loginForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      errorMsg.hidden = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Enter your username and password.');
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = 'Signing in…';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.token || !data.user) {
          showError(data.error || 'Login failed. Check your username and password.');
          return;
        }

        if (data.user.role === 'student' && !data.user.student_id) {
          showError(
            'This student account is not linked to a student record. ' +
            'Ask the teacher to recreate the account in Attendance Settings.'
          );
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        if (data.user.role === 'student') {
          window.location.replace('student-portal.html');
        } else if (data.user.role === 'admin') {
          window.location.replace('admin-dashboard.html');
        } else if (data.user.role === 'teacher') {
          window.location.replace('dashboard.html');
        } else {
          localStorage.clear();
          showError('This account has an unrecognized role.');
        }
      } catch (error) {
        showError('Could not connect to the server. Please try again.');
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Sign In';
      }
    });

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.hidden = false;
    }
  </script>
</body>
</html>
