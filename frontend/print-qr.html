
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code ID Cards - Print</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: white; padding: 20px; }
        .controls { text-align: center; margin-bottom: 20px; }
        .controls button { padding: 12px 30px; background: #880e4f; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1em; margin: 5px; }
        .controls button:hover { background: #ad1457; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 900px; margin: 0 auto; }
        .id-card { border: 2px solid #880e4f; border-radius: 12px; padding: 15px; text-align: center; background: white; page-break-inside: avoid; }
        .id-card .school-name { font-size: 0.7em; color: #880e4f; font-weight: bold; margin-bottom: 3px; }
        .id-card .section-name { font-size: 0.6em; color: #666; margin-bottom: 8px; }
        .id-card .student-name { font-size: 0.85em; font-weight: bold; color: #333; margin-top: 8px; }
        .id-card .student-sex { font-size: 0.7em; color: #888; }
        .id-card .qr-container { display: flex; justify-content: center; margin: 8px 0; }
        .loading { text-align: center; padding: 40px; color: #888; font-size: 1.2em; }
        @media print {
            .controls { display: none; }
            body { padding: 10px; }
            .cards-grid { gap: 10px; }
            .id-card { border-width: 1px; }
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="window.print()">Print All ID Cards</button>
        <button onclick="window.close()">Close</button>
    </div>
    <div id="cardsContainer" class="loading">Loading students...</div>
    <script>
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; }

        async function loadAndGenerateCards() {
            try {
                var response = await fetch('/api/students', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) {
                    document.getElementById('cardsContainer').textContent = 'Failed to load students. Please login again.';
                    return;
                }
                var students = await response.json();
                if (students.length === 0) {
                    document.getElementById('cardsContainer').textContent = 'No students found.';
                    return;
                }

                var container = document.getElementById('cardsContainer');
                container.className = 'cards-grid';
                container.innerHTML = '';

                for (var i = 0; i < students.length; i++) {
                    var s = students[i];
                    var card = document.createElement('div');
                    card.className = 'id-card';

                    var schoolDiv = document.createElement('div');
                    schoolDiv.className = 'school-name';
                    schoolDiv.textContent = 'Sta. Rosa Elementary School';
                    card.appendChild(schoolDiv);

                    var sectionDiv = document.createElement('div');
                    sectionDiv.className = 'section-name';
                    sectionDiv.textContent = 'Grade 6 - Great Geniuses | S.Y. 2026-2027';
                    card.appendChild(sectionDiv);

                    var qrDiv = document.createElement('div');
                    qrDiv.className = 'qr-container';
                    var qrHolder = document.createElement('div');
                    qrHolder.id = 'qr-' + i;
                    qrDiv.appendChild(qrHolder);
                    card.appendChild(qrDiv);

                    var nameDiv = document.createElement('div');
                    nameDiv.className = 'student-name';
                    nameDiv.textContent = s.full_name;
                    card.appendChild(nameDiv);

                    var sexDiv = document.createElement('div');
                    sexDiv.className = 'student-sex';
                    sexDiv.textContent = s.sex === 'M' ? 'Male' : 'Female';
                    card.appendChild(sexDiv);

                    container.appendChild(card);

                    new QRCode(qrHolder, {
                        text: s.qr_code || s.full_name,
                        width: 120,
                        height: 120,
                        colorDark: '#880e4f',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }
            } catch (err) {
                document.getElementById('cardsContainer').textContent = 'Error loading students. Please try again.';
            }
        }

        loadAndGenerateCards();
    </script>
</body>
</html>
