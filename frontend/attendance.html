
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan QR - QR Attendance System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        .attendance-container { max-width: 900px; margin: 0 auto; padding: 15px; }
        .nav-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; padding: 12px; background: #1e1e2e; border-radius: 10px; justify-content: center; }
        .nav-bar a { padding: 8px 14px; background: #2a2a3e; color: #ccc; text-decoration: none; border-radius: 6px; font-size: 0.8em; transition: all 0.2s; white-space: nowrap; }
        .nav-bar a:hover, .nav-bar a.active { background: #00b894; color: white; }
        .nav-bar a.logout-btn { background: #ff6b6b33; color: #ff6b6b; }
        .nav-bar a.logout-btn:hover { background: #ff6b6b; color: white; }
        .page-header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .page-header h1 { font-size: 1.3em; color: #00b894; margin-bottom: 5px; }
        .page-header p { color: #888; font-size: 0.85em; }
        .scanner-section { background: #1e1e2e; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .scanner-section h2 { color: #00b894; font-size: 1em; margin-bottom: 15px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        .btn-scan { padding: 12px 30px; background: linear-gradient(135deg, #00b894, #00cec9); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95em; margin: 10px 5px; }
        .btn-scan:hover { transform: scale(1.03); }
        .btn-scan.stop { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
        .manual-section { background: #1e1e2e; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .manual-section h2 { color: #00b894; font-size: 1em; margin-bottom: 15px; }
        .manual-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .manual-form select, .manual-form input { padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background: #2a2a3e; color: white; font-size: 0.9em; flex: 1; min-width: 150px; }
        .manual-form select:focus, .manual-form input:focus { border-color: #00b894; outline: none; }
        .scan-result { padding: 15px; border-radius: 8px; margin-top: 15px; display: none; text-align: center; font-size: 0.9em; }
        .scan-result.success { background: #00b89422; color: #00b894; border: 1px solid #00b89444; display: block; }
        .scan-result.error { background: #ff6b6b22; color: #ff6b6b; border: 1px solid #ff6b6b44; display: block; }
        .scan-result.info { background: #74b9ff22; color: #74b9ff; border: 1px solid #74b9ff44; display: block; }
        .today-section { background: #1e1e2e; padding: 20px; border-radius: 12px; }
        .today-section h2 { color: #00b894; font-size: 1em; margin-bottom: 15px; }
        .table-wrapper { overflow-x: auto; }
        .today-table { width: 100%; border-collapse: collapse; }
        .today-table th { background: #16213e; color: #00b894; padding: 10px 12px; text-align: left; font-size: 0.8em; }
        .today-table td { padding: 10px 12px; border-bottom: 1px solid #333; color: #ddd; font-size: 0.8em; }
        @media (max-width: 768px) { .nav-bar a { padding: 7px 10px; font-size: 0.75em; } .manual-form { flex-direction: column; } }
        @media (max-width: 480px) { .attendance-container { padding: 10px; } .nav-bar { gap: 5px; } .nav-bar a { padding: 6px 8px; font-size: 0.7em; } }
    </style>
</head>
<body>
    <div class="attendance-container">
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="attendance.html" class="active">Scan QR</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html">SMS Logs</a>
            <a href="manage-users.html">Manage Users</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>

        <div class="page-header">
            <h1>QR Code Scanner</h1>
            <p>Scan student QR codes to record attendance</p>
        </div>

        <div class="scanner-section">
            <h2>Camera Scanner</h2>
            <div id="reader"></div>
            <div style="margin-top: 15px;">
                <button class="btn-scan" onclick="startScanner()">Start Camera</button>
                <button class="btn-scan stop" onclick="stopScanner()">Stop Camera</button>
            </div>
            <div class="scan-result" id="scanResult"></div>
        </div>

        <div class="manual-section">
            <h2>Manual Attendance</h2>
            <div class="manual-form">
                <select id="studentSelect">
                    <option value="">Select a student</option>
                </select>
                <select id="statusSelect">
                    <option value="Present">Present</option>
                    <option value="Late">Late</option>
                    <option value="Absent">Absent</option>
                </select>
                <button class="btn-scan" onclick="recordManual()">Record</button>
            </div>
            <div class="scan-result" id="manualResult"></div>
        </div>

        <div class="today-section">
            <h2>Today's Attendance</h2>
            <div class="table-wrapper">
                <table class="today-table">
                    <thead><tr><th>#</th><th>Student</th><th>Status</th><th>Time In</th></tr></thead>
                    <tbody id="todayTableBody"><tr><td colspan="4" style="text-align:center; color:#888;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        var token = localStorage.getItem('token');
        var user = null;
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }
        if (!token) { window.location.href = 'index.html'; }

        var html5QrCode = null;
        var isScanning = false;

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        function showResult(elementId, message, type) {
            var el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'scan-result ' + type;
            setTimeout(function() { el.className = 'scan-result'; }, 5000);
        }

        // Start camera scanner
        function startScanner() {
            if (isScanning) return;
            html5QrCode = new Html5Qrcode('reader');
            html5QrCode.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                function(decodedText) {
                    recordAttendance(decodedText, 'scanResult');
                    stopScanner();
                },
                function(errorMessage) {}
            ).then(function() {
                isScanning = true;
            }).catch(function(err) {
                showResult('scanResult', 'Camera access denied or not available. Use manual attendance instead.', 'error');
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(function() { isScanning = false; }).catch(function() { isScanning = false; });
            }
        }

        // Record attendance via QR scan
        async function recordAttendance(qrCode, resultId) {
            try {
                var response = await fetch('/api/attendance/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ qr_code: qrCode })
                });
                var data = await response.json();
                if (response.ok) {
                    showResult(resultId, 'Attendance recorded for ' + (data.student_name || qrCode) + ' - ' + (data.status || 'Present'), 'success');
                    loadTodayAttendance();
                } else {
                    showResult(resultId, data.error || 'Failed to record attendance.', 'error');
                }
            } catch (err) {
                showResult(resultId, 'Connection error. Server may be starting up.', 'error');
            }
        }

        // Manual attendance
        function recordManual() {
            var studentId = document.getElementById('studentSelect').value;
            var status = document.getElementById('statusSelect').value;
            if (!studentId) { showResult('manualResult', 'Please select a student.', 'error'); return; }

            fetch('/api/attendance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ student_id: parseInt(studentId), status: status })
            }).then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
            .then(function(result) {
                if (result.ok) {
                    showResult('manualResult', 'Attendance recorded successfully!', 'success');
                    loadTodayAttendance();
                } else {
                    showResult('manualResult', result.data.error || 'Failed.', 'error');
                }
            }).catch(function() {
                showResult('manualResult', 'Connection error.', 'error');
            });
        }

        // Load students for dropdown
        async function loadStudentDropdown() {
            try {
                var response = await fetch('/api/students', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) return;
                var students = await response.json();
                var select = document.getElementById('studentSelect');
                for (var i = 0; i < students.length; i++) {
                    var s = students[i];
                    var option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = s.last_name + ', ' + s.first_name + (s.middle_name ? ' ' + s.middle_name : '');
                    select.appendChild(option);
                }
            } catch (err) { console.error('Load students error:', err); }
        }

        // Load today's attendance
        async function loadTodayAttendance() {
            try {
                var today = new Date().toISOString().split('T')[0];
                var response = await fetch('/api/attendance?date=' + today, { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) return;
                var records = await response.json();
                var tbody = document.getElementById('todayTableBody');
                if (!records || records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">No attendance recorded today.</td></tr>';
                    return;
                }
                var html = '';
                for (var i = 0; i < records.length; i++) {
                    var r = records[i];
                    var sc = r.status === 'Present' ? '#00b894' : r.status === 'Late' ? '#ffd93d' : '#ff6b6b';
                    html += '<tr><td>' + (i+1) + '</td><td><strong>' + (r.student_name || r.first_name + ' ' + r.last_name) + '</strong></td><td style="color:' + sc + ';font-weight:bold;">' + r.status + '</td><td>' + (r.time_in || '-') + '</td></tr>';
                }
                tbody.innerHTML = html;
            } catch (err) {
                document.getElementById('todayTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">Could not load attendance.</td></tr>';
            }
        }

        loadStudentDropdown();
        loadTodayAttendance();
    </script>
</body>
</html>
