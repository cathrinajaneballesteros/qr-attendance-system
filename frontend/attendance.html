
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance - QR Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .clock-section { background: linear-gradient(135deg, #880e4f, #ad1457); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; color: white; }
        .clock-time { font-size: 2em; font-weight: bold; font-family: 'Courier New', monospace; }
        .clock-date { font-size: 0.85em; opacity: 0.9; }
        .scanner-section { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .scanner-section h2 { color: #880e4f; margin-bottom: 15px; font-size: 1.1em; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto 15px; border-radius: 12px; overflow: hidden; }
        .scan-btn { padding: 12px 25px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9em; margin: 5px; }
        .btn-start { background: #880e4f; color: white; }
        .btn-stop { background: #c62828; color: white; }
        .manual-input { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .manual-input input { flex: 1; min-width: 200px; padding: 12px; border: 2px solid #fce4ec; border-radius: 10px; font-size: 0.9em; }
        .manual-input button { padding: 12px 20px; background: #880e4f; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .scan-result { padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }
        .scan-success { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; }
        .scan-error { background: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }
        .scan-duplicate { background: #fff3e0; border: 1px solid #ffcc80; color: #e65100; }
        .records-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .records-section h2 { color: #880e4f; margin-bottom: 15px; font-size: 1.1em; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #fce4ec; color: #880e4f; padding: 10px 8px; text-align: left; font-size: 0.8em; }
        td { padding: 8px; border-bottom: 1px solid #fce4ec; }
        tr:hover { background: #fff5f7; }
        @media (max-width: 480px) { .clock-time { font-size: 1.5em; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="attendance.html" class="active">Attendance</a>
            <a href="students.html">Students</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html">SMS Logs</a>
            <a href="settings.html">Attendance Settings</a><a href="records.html">Download Records</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>
        <div class="clock-section">
            <div class="clock-time" id="clockTime">--:--:-- --</div>
            <div class="clock-date" id="clockDate">Loading...</div>
        </div>
        <div class="scanner-section">
            <h2>QR Code Scanner</h2>
            <div id="reader"></div>
            <div style="text-align:center;">
                <button class="scan-btn btn-start" onclick="startScanner()">Start Camera</button>
                <button class="scan-btn btn-stop" onclick="stopScanner()">Stop Camera</button>
            </div>
            <div class="manual-input">
                <input type="text" id="manualQR" placeholder="Type student name or QR code">
                <button onclick="manualScan()">Record</button>
            </div>
            <div class="scan-result" id="scanResult"></div>
        </div>
        <div class="records-section">
            <h2>Today's Attendance Records</h2>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>No.</th><th>Student Name</th><th>Sex</th><th>Time In</th><th>Status</th></tr></thead>
                    <tbody id="recordsBody"><tr><td colspan="5" class="no-data">No records yet</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = 'index.html'; }
        var user = null;
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }
        var html5QrCode = null;

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        function updateClock() {
            var now = new Date();
            var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            var pht = new Date(utc + (8 * 3600000));
            var h = pht.getHours(); var m = pht.getMinutes(); var s = pht.getSeconds();
            var ampm = h >= 12 ? 'PM' : 'AM'; var dh = h % 12; if (dh === 0) dh = 12;
            document.getElementById('clockTime').textContent = (dh < 10 ? '0' : '') + dh + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + ' ' + ampm;
            var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('clockDate').textContent = days[pht.getDay()] + ', ' + months[pht.getMonth()] + ' ' + pht.getDate() + ', ' + pht.getFullYear();
        }
        updateClock(); setInterval(updateClock, 1000);

        async function startScanner() {
            try {
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    function(decodedText) { processQR(decodedText); },
                    function(errorMessage) {}
                );
            } catch (err) {
                showResult('Camera access denied or not available. Use manual input below.', 'error');
            }
        }

        async function stopScanner() {
            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch(e) {}
            }
        }

        function manualScan() {
            var qr = document.getElementById('manualQR').value.trim();
            if (qr) { processQR(qr); document.getElementById('manualQR').value = ''; }
        }

        document.getElementById('manualQR').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') manualScan();
        });

        async function processQR(qrCode) { var scanData={qr_code:qrCode}; try { var cfgResponse=await fetch("/api/settings",{headers:{"Authorization":"Bearer "+token}}); var cfg=await cfgResponse.json(); if(cfg.gps_enabled==="1"){var pos=await new Promise(function(resolve,reject){navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000});});scanData.latitude=pos.coords.latitude;scanData.longitude=pos.coords.longitude;} } catch(locationError) { showResult("Enable location access for attendance scanning.","error"); return; }
            try {
                var response = await fetch('/api/attendance/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(scanData)
                });
                var data = await response.json();
                if (response.ok) {
                    if (data.duplicate) {
                        showResult(data.student + ' - Already recorded at ' + data.time_in, 'duplicate');
                    } else {
                        showResult(data.student + ' - Recorded at ' + data.time_in, 'success');
                    }
                    loadRecords();
                } else {
                    showResult(data.error || 'Student not found', 'error');
                }
            } catch (err) {
                showResult('Connection error', 'error');
            }
        }

        function showResult(msg, type) {
            var el = document.getElementById('scanResult');
            el.textContent = msg;
            el.className = 'scan-result';
            if (type === 'success') el.classList.add('scan-success');
            else if (type === 'duplicate') el.classList.add('scan-duplicate');
            else el.classList.add('scan-error');
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, 5000);
        }

        async function loadRecords() {
            try {
                var response = await fetch('/api/attendance/today', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) return;
                var records = await response.json();
                var tbody = document.getElementById('recordsBody');
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="no-data">No records yet</td></tr>';
                    return;
                }
                var html = '';
                for (var i = 0; i < records.length; i++) {
                    html += '<tr><td>' + (i + 1) + '</td><td>' + records[i].full_name + '</td><td>' + records[i].sex + '</td><td>' + records[i].time_in + '</td><td>' + records[i].status + '</td></tr>';
                }
                tbody.innerHTML = html;
            } catch (err) { console.log('Load records error:', err); }
        }
        loadRecords();
    </script>
</body>
</html>
