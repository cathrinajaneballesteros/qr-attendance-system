<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download Attendance</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:700px;margin:32px auto;padding:22px;background:#fff;border-radius:12px}label{display:block;margin:14px 0 5px}input,button{padding:10px}</style></head><body><main><h1>Download Attendance Records</h1><label>From</label><input id="from" type="date"><label>To</label><input id="to" type="date"><br><button onclick="downloadRecords()">Download CSV</button><span id="msg"></span></main><script>
const token=localStorage.getItem('token');if(!token)location.href='index.html';const d=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});document.getElementById('from').value=d;document.getElementById('to').value=d;
async function downloadRecords(){const q=new URLSearchParams({from:document.getElementById('from').value,to:document.getElementById('to').value});const r=await fetch('/api/attendance/export?'+q,{headers:{'Authorization':'Bearer '+token}});if(!r.ok){document.getElementById('msg').textContent=' Could not download these records.';return}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance_'+q.get('from')+'_'+q.get('to')+'.csv';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
