
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SF2 Submission Progress - QR Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .section-card h2 { color: #880e4f; margin-bottom: 15px; font-size: 1.1em; }
        .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
        .month-card { background: #fff5f7; border: 2px solid #fce4ec; border-radius: 10px; padding: 15px; }
        .month-card h3 { color: #880e4f; font-size: 0.95em; margin-bottom: 10px; }
        .month-card .status { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .month-card select { width: 100%; padding: 8px; border: 2px solid #fce4ec; border-radius: 6px; font-size: 0.85em; }
        .month-card select:focus { border-color: #e91e63; outline: none; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-pending { background: #ffcc80; }
        .dot-submitted { background: #a5d6a7; }
        .dot-approved { background: #2e7d32; }
        .dot-not-started { background: #ccc; }
        .save-btn { display: block; margin: 20px auto 0; padding: 12px 40px; background: #880e4f; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1em; }
        .save-btn:hover { background: #ad1457; }
        .save-msg { text-align: center; margin-top: 10px; font-size: 0.85em; display: none; }
        .save-msg-success { color: #2e7d32; }
        .save-msg-error { color: #c62828; }
        .legend { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; font-size: 0.8em; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        @media (max-width: 480px) { .progress-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="manage-users.html">Manage Teachers</a>
            <a href="sf2-progress.html" class="active">SF2 Submission Progress</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>
        <div class="section-card">
            <h2>SF2 Submission Progress - S.Y. 2026-2027</h2>
            <div class="legend">
                <div class="legend-item"><div class="status-dot dot-not-started"></div> Not Started</div>
                <div class="legend-item"><div class="status-dot dot-pending"></div> Pending</div>
                <div class="legend-item"><div class="status-dot dot-submitted"></div> Submitted</div>
                <div class="legend-item"><div class="status-dot dot-approved"></div> Approved</div>
            </div>
            <div class="progress-grid" id="progressGrid"></div>
            <button class="save-btn" onclick="saveProgress()">Save Progress</button>
            <div class="save-msg" id="saveMsg"></div>
        </div>
    </div>
    <script>
        var token = localStorage.getItem('token');
        var user = null;
        if (!token) { window.location.href = 'index.html'; }
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }
        if (user && user.role !== 'admin') { window.location.href = 'dashboard.html'; }

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        var months = [
            { name: 'June 2026', key: 'june_2026' },
            { name: 'July 2026', key: 'july_2026' },
            { name: 'August 2026', key: 'august_2026' },
            { name: 'September 2026', key: 'september_2026' },
            { name: 'October 2026', key: 'october_2026' },
            { name: 'November 2026', key: 'november_2026' },
            { name: 'December 2026', key: 'december_2026' },
            { name: 'January 2027', key: 'january_2027' },
            { name: 'February 2027', key: 'february_2027' },
            { name: 'March 2027', key: 'march_2027' }
        ];

        function renderGrid(savedProgress) {
            var grid = document.getElementById('progressGrid');
            var html = '';
            for (var i = 0; i < months.length; i++) {
                var m = months[i];
                var currentStatus = (savedProgress && savedProgress[m.key]) ? savedProgress[m.key] : 'not_started';
                var dotClass = 'dot-not-started';
                if (currentStatus === 'pending') dotClass = 'dot-pending';
                else if (currentStatus === 'submitted') dotClass = 'dot-submitted';
                else if (currentStatus === 'approved') dotClass = 'dot-approved';

                html += '<div class="month-card">';
                html += '<h3>' + m.name + '</h3>';
                html += '<div class="status"><div class="status-dot ' + dotClass + '" id="dot-' + m.key + '"></div><span id="label-' + m.key + '">' + currentStatus.replace('_', ' ').toUpperCase() + '</span></div>';
                html += '<select id="select-' + m.key + '" onchange="updateDot(\'' + m.key + '\')">';
                html += '<option value="not_started"' + (currentStatus === 'not_started' ? ' selected' : '') + '>Not Started</option>';
                html += '<option value="pending"' + (currentStatus === 'pending' ? ' selected' : '') + '>Pending</option>';
                html += '<option value="submitted"' + (currentStatus === 'submitted' ? ' selected' : '') + '>Submitted</option>';
                html += '<option value="approved"' + (currentStatus === 'approved' ? ' selected' : '') + '>Approved</option>';
                html += '</select>';
                html += '</div>';
            }
            grid.innerHTML = html;
        }

        function updateDot(key) {
            var val = document.getElementById('select-' + key).value;
            var dot = document.getElementById('dot-' + key);
            var label = document.getElementById('label-' + key);
            dot.className = 'status-dot';
            if (val === 'not_started') dot.classList.add('dot-not-started');
            else if (val === 'pending') dot.classList.add('dot-pending');
            else if (val === 'submitted') dot.classList.add('dot-submitted');
            else if (val === 'approved') dot.classList.add('dot-approved');
            label.textContent = val.replace('_', ' ').toUpperCase();
        }

        async function saveProgress() {
            var progress = {};
            for (var i = 0; i < months.length; i++) {
                var sel = document.getElementById('select-' + months[i].key);
                if (sel) progress[months[i].key] = sel.value;
            }
            try {
                var response = await fetch('/api/sf2/progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ school_year: '2026-2027', progress: progress })
                });
                var data = await response.json();
                var msgEl = document.getElementById('saveMsg');
                if (response.ok) {
                    msgEl.textContent = 'Progress saved successfully!';
                    msgEl.className = 'save-msg save-msg-success';
                } else {
                    msgEl.textContent = data.error || 'Failed to save progress';
                    msgEl.className = 'save-msg save-msg-error';
                }
                msgEl.style.display = 'block';
                setTimeout(function() { msgEl.style.display = 'none'; }, 4000);
            } catch (err) {
                var msgEl2 = document.getElementById('saveMsg');
                msgEl2.textContent = 'Connection error. Is the server running?';
                msgEl2.className = 'save-msg save-msg-error';
                msgEl2.style.display = 'block';
            }
        }

        async function loadProgress() {
            try {
                var response = await fetch('/api/sf2/report?month=' + new Date().toISOString().substring(0, 7), { headers: { 'Authorization': 'Bearer ' + token } });
                if (response.ok) {
                    renderGrid({});
                } else {
                    renderGrid({});
                }
            } catch (err) {
                renderGrid({});
            }
        }
        loadProgress();
    </script>
</body>
</html>
