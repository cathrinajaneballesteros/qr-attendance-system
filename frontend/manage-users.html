
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Teachers - QR Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .section-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .section-card h2 { color: #880e4f; margin-bottom: 15px; font-size: 1.1em; }
        .add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; padding: 15px; background: #fff5f7; border-radius: 10px; }
        .add-form input, .add-form select { padding: 10px; border: 2px solid #fce4ec; border-radius: 8px; font-size: 0.9em; }
        .add-form input:focus, .add-form select:focus { border-color: #e91e63; outline: none; }
        .add-form button { grid-column: 1 / -1; padding: 12px; background: #880e4f; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95em; }
        .add-form button:hover { background: #ad1457; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; font-size: 0.85em; text-align: center; }
        .msg-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .msg-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { background: #fce4ec; color: #880e4f; padding: 10px 8px; text-align: left; font-size: 0.8em; }
        td { padding: 8px; border-bottom: 1px solid #fce4ec; }
        tr:hover { background: #fff5f7; }
        .btn-delete { padding: 6px 12px; background: #c62828; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8em; }
        .btn-delete:hover { background: #b71c1c; }
        @media (max-width: 480px) { .add-form { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="manage-users.html" class="active">Manage Teachers</a>
            <a href="sf2-progress.html">SF2 Submission Progress</a>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>
        </div>
        <div class="section-card">
            <h2>Add New Teacher</h2>
            <div class="msg" id="formMsg"></div>
            <div class="add-form">
                <input type="text" id="fullName" placeholder="Full Name">
                <input type="text" id="newUsername" placeholder="Username">
                <input type="password" id="newPassword" placeholder="Password">
                <select id="newRole">
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
                <button onclick="addUser()">Add Teacher</button>
            </div>
        </div>
        <div class="section-card">
            <h2>All Users</h2>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>No.</th><th>Full Name</th><th>Username</th><th>Role</th><th>Action</th></tr></thead>
                    <tbody id="usersBody"><tr><td colspan="5" class="no-data">Loading users...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        var token = localStorage.getItem('token');
        var user = null;
        if (!token) { window.location.href = 'index.html'; }
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }
        if (user && user.role !== 'admin') { window.location.href = 'dashboard.html'; }

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        function showMsg(text, type) {
            var el = document.getElementById('formMsg');
            el.textContent = text;
            el.className = 'msg';
            el.classList.add(type === 'success' ? 'msg-success' : 'msg-error');
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, 4000);
        }

        async function addUser() {
            var fullName = document.getElementById('fullName').value.trim();
            var username = document.getElementById('newUsername').value.trim();
            var password = document.getElementById('newPassword').value;
            var role = document.getElementById('newRole').value;

            if (!fullName || !username || !password) {
                showMsg('Please fill in all fields', 'error');
                return;
            }

            try {
                var response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ full_name: fullName, username: username, password: password, role: role })
                });
                var data = await response.json();
                if (response.ok) {
                    showMsg('Teacher added successfully!', 'success');
                    document.getElementById('fullName').value = '';
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    loadUsers();
                } else {
                    showMsg(data.error || 'Failed to add teacher', 'error');
                }
            } catch (err) {
                showMsg('Connection error. Is the server running?', 'error');
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                var response = await fetch('/api/auth/users/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var data = await response.json();
                if (response.ok) {
                    showMsg('User deleted successfully', 'success');
                    loadUsers();
                } else {
                    showMsg(data.error || 'Failed to delete user', 'error');
                }
            } catch (err) {
                showMsg('Connection error', 'error');
            }
        }

        async function loadUsers() {
            try {
                var response = await fetch('/api/auth/users', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!response.ok) {
                    document.getElementById('usersBody').innerHTML = '<tr><td colspan="5" class="no-data">Failed to load users</td></tr>';
                    return;
                }
                var users = await response.json();
                var tbody = document.getElementById('usersBody');
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="no-data">No users found</td></tr>';
                    return;
                }
                var html = '';
                for (var i = 0; i < users.length; i++) {
                    var u = users[i];
                    var deleteBtn = u.username === 'admin' ? '<span style="color:#999;">Protected</span>' : '<button class="btn-delete" onclick="deleteUser(' + u.id + ')">Delete</button>';
                    html += '<tr>';
                    html += '<td>' + (i + 1) + '</td>';
                    html += '<td>' + (u.full_name || '') + '</td>';
                    html += '<td>' + u.username + '</td>';
                    html += '<td>' + u.role + '</td>';
                    html += '<td>' + deleteBtn + '</td>';
                    html += '</tr>';
                }
                tbody.innerHTML = html;
            } catch (err) {
                document.getElementById('usersBody').innerHTML = '<tr><td colspan="5" class="no-data">Error loading users</td></tr>';
            }
        }
        loadUsers();
    </script>
</body>
</html>
