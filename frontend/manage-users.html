
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - QR Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .users-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .users-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .users-header h1 { font-size: 1.5em; margin-bottom: 5px; }
        .users-header p { opacity: 0.8; font-size: 0.9em; }

        .nav-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; background: #1e1e2e; border-radius: 10px; justify-content: center; }
        .nav-bar a { padding: 8px 16px; background: #2a2a3e; color: #ccc; text-decoration: none; border-radius: 6px; font-size: 0.85em; transition: all 0.2s; }
        .nav-bar a:hover, .nav-bar a.active { background: #00b894; color: white; }

        .add-user-form { background: #1e1e2e; padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        .add-user-form h2 { color: #00b894; margin-bottom: 15px; font-size: 1.2em; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { color: #ccc; font-size: 0.85em; }
        .form-group input, .form-group select { padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background: #2a2a3e; color: white; font-size: 0.9em; }
        .form-group input:focus, .form-group select:focus { border-color: #00b894; outline: none; }

        .btn-add { padding: 12px 30px; background: linear-gradient(135deg, #00b894, #00cec9); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1em; margin-top: 15px; transition: transform 0.2s; width: 100%; }
        .btn-add:hover { transform: scale(1.02); }

        .btn-delete { padding: 6px 15px; background: #ff6b6b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8em; transition: transform 0.2s; }
        .btn-delete:hover { transform: scale(1.05); background: #ee5a5a; }

        .btn-reset { padding: 6px 15px; background: #ffd93d; color: #333; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8em; transition: transform 0.2s; }
        .btn-reset:hover { transform: scale(1.05); }

        .users-table-wrapper { background: #1e1e2e; border-radius: 12px; overflow: hidden; }
        .users-table-wrapper h2 { color: #00b894; padding: 20px 20px 10px 20px; font-size: 1.2em; }
        .users-table { width: 100%; border-collapse: collapse; }
        .users-table th { background: #16213e; color: #00b894; padding: 12px 15px; text-align: left; font-size: 0.85em; }
        .users-table td { padding: 12px 15px; border-bottom: 1px solid #333; color: #ddd; font-size: 0.9em; }
        .users-table tr:hover { background: #2a2a3e; }

        .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        .role-badge.admin { background: #6c5ce7; color: white; }
        .role-badge.teacher { background: #00b894; color: white; }

        .message { padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9em; display: none; }
        .message.success { background: #00b89433; color: #00b894; border: 1px solid #00b894; display: block; }
        .message.error { background: #ff6b6b33; color: #ff6b6b; border: 1px solid #ff6b6b; display: block; }

        .no-access { text-align: center; padding: 60px 20px; color: #ff6b6b; }
        .no-access h2 { font-size: 1.5em; margin-bottom: 10px; }
        .no-access p { color: #888; }
        .no-access a { color: #00b894; text-decoration: none; }

        .user-count { color: #888; font-size: 0.85em; padding: 0 20px 15px 20px; }
    </style>
</head>
<body>
    <div class="users-container">
        <!-- Navigation -->
        <div class="nav-bar">
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Scan QR</a>
            <a href="sf2-report.html">SF2 Report</a>
            <a href="sms-logs.html">SMS Logs</a>
            <a href="manage-users.html" class="active">Manage Users</a>
            <a href="index.html" onclick="localStorage.clear()">Logout</a>
        </div>

        <!-- Header -->
        <div class="users-header">
            <h1>Manage Users</h1>
            <p>Add teachers and manage user accounts</p>
        </div>

        <!-- No Access Message (for non-admins) -->
        <div class="no-access" id="noAccess" style="display:none;">
            <h2>Admin Access Only</h2>
            <p>Only administrators can manage users.</p>
            <p><a href="dashboard.html">Back to Dashboard</a></p>
        </div>

        <!-- Admin Content -->
        <div id="adminContent" style="display:none;">
            <!-- Message -->
            <div class="message" id="messageDiv"></div>

            <!-- Add User Form -->
            <div class="add-user-form">
                <h2>Add New User</h2>
                <form id="addUserForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="fullName" placeholder="e.g. Maria Santos" required>
                        </div>
                        <div class="form-group">
                            <label>Username *</label>
                            <input type="text" id="newUsername" placeholder="e.g. msantos" required>
                        </div>
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="newPassword" placeholder="Minimum 6 characters" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label>Role *</label>
                            <select id="userRole">
                                <option value="teacher">Teacher</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">Add User</button>
                </form>
            </div>

            <!-- Users List -->
            <div class="users-table-wrapper">
                <h2>All Users</h2>
                <p class="user-count" id="userCount">Loading...</p>
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="6" style="text-align:center; color:#888;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = 'index.html';
        }

        if (user.role !== 'admin') {
            document.getElementById('noAccess').style.display = 'block';
        } else {
            document.getElementById('adminContent').style.display = 'block';
            loadUsers();
        }

        function showMessage(text, type) {
            const div = document.getElementById('messageDiv');
            div.textContent = text;
            div.className = `message ${type}`;
            setTimeout(() => { div.style.display = 'none'; div.className = 'message'; }, 5000);
        }

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('userRole').value;

            if (!fullName || !username || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, password, full_name: fullName, role })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(`User "${fullName}" (${role}) created successfully!`, 'success');
                    document.getElementById('addUserForm').reset();
                    loadUsers();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (err) {
                console.error('Add user error:', err);
                showMessage('Failed to add user. Check server connection.', 'error');
            }
        });

        async function loadUsers() {
            try {
                const response = await fetch('/api/auth/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load users');
                const users = await response.json();

                document.getElementById('userCount').textContent = `Total: ${users.length} user(s)`;

                const tbody = document.getElementById('usersTableBody');
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">No users found.</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map((u, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td><strong>${u.full_name}</strong></td>
                        <td>${u.username}</td>
                        <td><span class="role-badge ${u.role}">${u.role === 'admin' ? 'Admin' : 'Teacher'}</span></td>
                        <td>${new Date(u.created_at).toLocaleDateString()}</td>
                        <td>
                            ${u.username !== 'admin' ? `
                                <button class="btn-reset" onclick="resetPassword(${u.id}, '${u.username}')">Reset</button>
                                <button class="btn-delete" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>
                            ` : '<span style="color:#888; font-size:0.8em;">Protected</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Load users error:', err);
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:#ff6b6b;">Failed to load users.</td></tr>';
            }
        }

        async function deleteUser(id, username) {
            if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;

            try {
                const response = await fetch(`/api/auth/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (response.ok) {
                    showMessage(`User "${username}" deleted successfully.`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (err) {
                showMessage('Failed to delete user.', 'error');
            }
        }

        async function resetPassword(id, username) {
            const newPassword = prompt(`Enter new password for "${username}" (min 6 characters):`);
            if (!newPassword || newPassword.length < 6) {
                if (newPassword) showMessage('Password must be at least 6 characters.', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/auth/users/${id}/reset-password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ password: newPassword })
                });

                const data = await response.json();
                if (response.ok) {
                    showMessage(`Password for "${username}" reset successfully!`, 'success');
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (err) {
                showMessage('Failed to reset password.', 'error');
            }
        }
    </script>
</body>
</html>
