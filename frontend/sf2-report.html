
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SF2 Report - QR Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding: 15px; }
        .sf2-container { max-width: 1100px; margin: 0 auto; }
        .controls-section { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); }
        .controls-section h2 { color: #c2185b; font-size: 1.1em; margin-bottom: 15px; }
        .controls-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .controls-row .form-group { min-width: 120px; }
        .controls-row .form-group label { display: block; color: #666; font-size: 0.8em; margin-bottom: 5px; font-weight: bold; }
        .controls-row .form-group select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #f8bbd0; background: #fff5f7; color: #333; font-size: 0.9em; }
        .controls-row .form-group select:focus { border-color: #e91e63; outline: none; }
        .btn-generate { background: linear-gradient(135deg, #e91e63, #ec407a); color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        .btn-generate:hover { transform: scale(1.02); }
        .btn-download { background: #fce4ec; color: #c2185b; border: 1px solid #f8bbd0; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .btn-download:hover { background: #f8bbd0; }

        .report-section { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(219,112,147,0.1); overflow-x: auto; }
        .sf2-header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #fce4ec; }
        .sf2-header h2 { color: #c2185b; font-size: 1.1em; margin-bottom: 3px; }
        .sf2-header p { color: #666; font-size: 0.8em; margin: 2px 0; }
        .sf2-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; font-size: 0.8em; }
        .sf2-info div { color: #555; }
        .sf2-info span { font-weight: bold; color: #333; }

        .sf2-table { width: 100%; border-collapse: collapse; font-size: 0.7em; }
        .sf2-table th { background: #fce4ec; color: #c2185b; padding: 6px 4px; text-align: center; border: 1px solid #f8bbd0; font-size: 0.85em; }
        .sf2-table td { padding: 4px 3px; border: 1px solid #fce4ec; text-align: center; color: #555; }
        .sf2-table .name-cell { text-align: left; padding-left: 8px; white-space: nowrap; min-width: 180px; }
        .sf2-table .gender-header { background: #fce4ec; color: #c2185b; font-weight: bold; text-align: left; padding-left: 8px; }
        .sf2-table .present-mark { color: #2e7d32; font-weight: bold; }
        .sf2-table .absent-mark { color: #c62828; font-weight: bold; }
        .sf2-table .weekend { background: #f5f5f5; }
        .sf2-table .total-col { background: #fff5f7; font-weight: bold; }

        .summary-section { margin-top: 20px; padding: 15px; background: #fff5f7; border-radius: 10px; border: 1px solid #fce4ec; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .summary-item { text-align: center; }
        .summary-item .value { font-size: 1.3em; font-weight: bold; color: #c2185b; }
        .summary-item .label { font-size: 0.75em; color: #888; }

        .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; padding-top: 20px; border-top: 1px solid #fce4ec; }
        .sig-block { text-align: center; }
        .sig-block .sig-label { font-size: 0.75em; color: #888; margin-bottom: 30px; }
        .sig-block .sig-name { font-weight: bold; color: #333; font-size: 0.9em; border-top: 1px solid #333; padding-top: 5px; display: inline-block; }
        .sig-block .sig-title { font-size: 0.75em; color: #666; }

        @media (max-width: 768px) { .sf2-info { grid-template-columns: 1fr; } .controls-row { flex-direction: column; } .signatures { grid-template-columns: 1fr; gap: 20px; } }
    </style>
</head>
<body>
    <div class="sf2-container">
        <div class="nav-bar" id="navBar"></div>

        <div class="controls-section">
            <h2>School Form 2 (SF2) Daily Attendance Report</h2>
            <div class="controls-row">
                <div class="form-group">
                    <label>Month</label>
                    <select id="monthSelect">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <select id="yearSelect">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <button class="btn-generate" onclick="generateReport()">Generate Report</button>
                <button class="btn-download" onclick="downloadReport()">Download .xlsx</button>
            </div>
        </div>

        <div class="report-section" id="reportSection">
            <div class="no-data">Select a month and year, then click "Generate Report".</div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('token');
        var user = null;
        if (!token) { window.location.href = 'index.html'; }
        try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }

        // Build nav - NO Manage Users on SF2 page
        function buildNav() {
            var nav = document.getElementById('navBar');
            var html = '';
            html += '<a href="dashboard.html">Dashboard</a>';
            html += '<a href="students.html">Students</a>';
            html += '<a href="attendance.html">Scan QR</a>';
            html += '<a href="sf2-report.html" class="active">SF2 Report</a>';
            html += '<a href="sms-logs.html">SMS Logs</a>';
            if (user && user.role === 'admin') {
                html += '<a href="manage-users.html">Manage Users</a>';
            }
            html += '<a href="#" class="logout-btn" onclick="confirmLogout(event)">Logout</a>';
            nav.innerHTML = html;
        }
        buildNav();

        function confirmLogout(e) {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) { localStorage.clear(); window.location.href = 'index.html'; }
        }

        // Set current month
        var now = new Date();
        document.getElementById('monthSelect').value = now.getMonth() + 1;

        var months = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        async function generateReport() {
            var month = document.getElementById('monthSelect').value;
            var year = document.getElementById('yearSelect').value;
            var section = document.getElementById('reportSection');
            section.innerHTML = '<div class="no-data">Generating report...</div>';

            try {
                var response = await fetch('/api/sf2/report?month=' + month + '&year=' + year, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.status === 401) { localStorage.clear(); window.location.href = 'index.html'; return; }
                if (!response.ok) { section.innerHTML = '<div class="no-data">Failed to generate report. Please try again.</div>'; return; }

                var data = await response.json();
                renderReport(data);
            } catch (err) {
                section.innerHTML = '<div class="no-data">Connection error. Server may be starting up.</div>';
            }
        }

        function renderReport(data) {
            var section = document.getElementById('reportSection');
            var html = '';

            // Header
            html += '<div class="sf2-header">';
            html += '<h2>School Form 2 (SF2) Daily Attendance Report of Learners</h2>';
            html += '<p>(This replaces Form 1, Form 2 & STS Form 4 - Absenteeism and Dropout Profile)</p>';
            html += '</div>';

            // School info
            html += '<div class="sf2-info">';
            html += '<div>School ID: <span>' + data.school_info.school_id + '</span></div>';
            html += '<div>Grade: <span>' + data.school_info.grade + '</span></div>';
            html += '<div>School Year: <span>' + data.school_info.school_year + '</span></div>';
            html += '<div>School Name: <span>' + data.school_info.school_name + '</span></div>';
            html += '<div>Section: <span>' + data.school_info.section + '</span></div>';
            html += '<div>Month: <span>' + months[data.month] + ' ' + data.year + '</span></div>';
            html += '</div>';

            // Table
            html += '<div class="table-wrapper"><table class="sf2-table">';

            // Header row
            html += '<thead><tr><th>No.</th><th class="name-cell">NAME (Last, First, Middle)</th>';
            for (var d = 1; d <= data.days_in_month; d++) {
                var dow = new Date(data.year, data.month - 1, d).getDay();
                var isWeekend = (dow === 0 || dow === 6);
                html += '<th' + (isWeekend ? ' class="weekend"' : '') + '>' + d + '</th>';
            }
            html += '<th class="total-col">Present</th><th class="total-col">Absent</th></tr></thead>';

            html += '<tbody>';

            // Males
            html += '<tr><td colspan="' + (data.days_in_month + 4) + '" class="gender-header">MALE</td></tr>';
            for (var m = 0; m < data.males.length; m++) {
                var ms = data.males[m];
                html += '<tr><td>' + (m + 1) + '</td><td class="name-cell">' + ms.name + '</td>';
                for (var md = 1; md <= data.days_in_month; md++) {
                    var status = ms.daily[md];
                    var cellClass = '';
                    var cellContent = '';
                    if (status === 'weekend') { cellClass = 'weekend'; }
                    else if (status === 'present') { cellClass = 'present-mark'; cellContent = '\u2713'; }
                    else if (status === 'absent') { cellClass = 'absent-mark'; cellContent = 'X'; }
                    html += '<td class="' + cellClass + '">' + cellContent + '</td>';
                }
                html += '<td class="total-col">' + ms.total_present + '</td><td class="total-col">' + ms.total_absent + '</td></tr>';
            }

            // Females
            html += '<tr><td colspan="' + (data.days_in_month + 4) + '" class="gender-header">FEMALE</td></tr>';
            for (var f = 0; f < data.females.length; f++) {
                var fs = data.females[f];
                html += '<tr><td>' + (f + 1) + '</td><td class="name-cell">' + fs.name + '</td>';
                for (var fd = 1; fd <= data.days_in_month; fd++) {
                    var fStatus = fs.daily[fd];
                    var fCellClass = '';
                    var fCellContent = '';
                    if (fStatus === 'weekend') { fCellClass = 'weekend'; }
                    else if (fStatus === 'present') { fCellClass = 'present-mark'; fCellContent = '\u2713'; }
                    else if (fStatus === 'absent') { fCellClass = 'absent-mark'; fCellContent = 'X'; }
                    html += '<td class="' + fCellClass + '">' + fCellContent + '</td>';
                }
                html += '<td class="total-col">' + fs.total_present + '</td><td class="total-col">' + fs.total_absent + '</td></tr>';
            }

            html += '</tbody></table></div>';

            // Summary
            html += '<div class="summary-section"><div class="summary-grid">';
            html += '<div class="summary-item"><div class="value">' + data.summary.total_students + '</div><div class="label">Total Students</div></div>';
            html += '<div class="summary-item"><div class="value">' + data.summary.male_count + '</div><div class="label">Male</div></div>';
            html += '<div class="summary-item"><div class="value">' + data.summary.female_count + '</div><div class="label">Female</div></div>';
            html += '<div class="summary-item"><div class="value">' + data.summary.total_present + '</div><div class="label">Total Present</div></div>';
            html += '<div class="summary-item"><div class="value">' + data.summary.total_absent + '</div><div class="label">Total Absent</div></div>';
            html += '<div class="summary-item"><div class="value">' + data.summary.attendance_rate + '%</div><div class="label">Attendance Rate</div></div>';
            html += '</div></div>';

            // Signatures
            html += '<div class="signatures">';
            html += '<div class="sig-block"><div class="sig-label">Prepared by:</div><div class="sig-name">TIFANNY MARTIN ARAGON</div><div class="sig-title">Class Adviser</div></div>';
            html += '<div class="sig-block"><div class="sig-label">Certified Correct:</div><div class="sig-name">MC RIZ TEMPLETON BUEN</div><div class="sig-title">School Head</div></div>';
            html += '</div>';

            section.innerHTML = html;
        }

        async function downloadReport() {
            var month = document.getElementById('monthSelect').value;
            var year = document.getElementById('yearSelect').value;

            try {
                var response = await fetch('/api/sf2/download?month=' + month + '&year=' + year, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!response.ok) {
                    alert('Failed to download SF2 report. Please generate the report first.');
                    return;
                }

                var blob = await response.blob();
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'SF2_' + months[parseInt(month)] + '_' + year + '_Grade6_GreatGeniuses.xlsx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert('Connection error. Please try again.');
            }
        }
    </script>
</body>
</html>
