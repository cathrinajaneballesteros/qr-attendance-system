
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SF2 Report - QR Attendance System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        .sf2-container { max-width: 1400px; margin: 0 auto; padding: 15px; }
        .sf2-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .sf2-header h1 { font-size: 1.3em; margin-bottom: 5px; }
        .sf2-header p { opacity: 0.8; font-size: 0.85em; }

        .nav-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; padding: 12px; background: #1e1e2e; border-radius: 10px; justify-content: center; }
        .nav-bar a { padding: 8px 14px; background: #2a2a3e; color: #ccc; text-decoration: none; border-radius: 6px; font-size: 0.8em; transition: all 0.2s; white-space: nowrap; }
        .nav-bar a:hover, .nav-bar a.active { background: #00b894; color: white; }
        .nav-bar a.logout-btn { background: #ff6b6b33; color: #ff6b6b; }
        .nav-bar a.logout-btn:hover { background: #ff6b6b; color: white; }

        .sf2-controls { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; padding: 18px; background: #1e1e2e; border-radius: 12px; }
        .sf2-controls label { color: #ccc; font-size: 0.85em; }
        .sf2-controls select { padding: 10px 15px; border-radius: 8px; border: 1px solid #333; background: #2a2a3e; color: white; font-size: 0.9em; }
        .btn-generate { padding: 10px 22px; background: linear-gradient(135deg, #00b894, #00cec9); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85em; white-space: nowrap; }
        .btn-download { padding: 10px 22px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85em; white-space: nowrap; }

        .sf2-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; padding: 12px; background: #1e1e2e; border-radius: 10px; }
        .sf2-info-item { display: flex; justify-content: space-between; padding: 8px 10px; background: #2a2a3e; border-radius: 6px; }
        .sf2-info-item .label { color: #888; font-size: 0.8em; }
        .sf2-info-item .value { color: #00b894; font-weight: bold; font-size: 0.8em; }

        .sf2-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 15px; border-radius: 10px; }
        .sf2-table { width: 100%; border-collapse: collapse; font-size: 0.7em; background: #1e1e2e; }
        .sf2-table th { background: #16213e; color: #00b894; padding: 6px 3px; border: 1px solid #333; text-align: center; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
        .sf2-table td { padding: 5px 3px; border: 1px solid #333; text-align: center; color: #ddd; }
        .sf2-table tr:hover { background: #2a2a3e; }
        .sf2-table .student-name { text-align: left; padding-left: 8px; white-space: nowrap; min-width: 180px; }
        .sf2-table .present { color: #00b894; }
        .sf2-table .absent { color: #ff6b6b; font-weight: bold; }
        .sf2-table .late { color: #ffd93d; }
        .sf2-table .total-row { background: #16213e; font-weight: bold; }
        .sf2-table .total-row td { color: #00b894; }

        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .summary-card { background: #1e1e2e; padding: 12px; border-radius: 10px; text-align: center; }
        .summary-card .number { font-size: 1.5em; font-weight: bold; color: #00b894; }
        .summary-card .label { color: #888; font-size: 0.8em; margin-top: 5px; }
        .summary-card.male .number { color: #74b9ff; }
        .summary-card.female .number { color: #fd79a8; }
        .summary-card.absent .number { color: #ff6b6b; }

        .signatures { display: flex; justify-content: space-between; margin-top: 25px; padding: 18px; background: #1e1e2e; border-radius: 10px; flex-wrap: wrap; gap: 20px; }
        .signature-block { text-align: center; flex: 1; min-width: 200px; }
        .signature-block .name { font-weight: bold; color: white; border-bottom: 2px solid #00b894; padding-bottom: 5px; margin-bottom: 5px; }
        .signature-block .title { color: #888; font-size: 0.85em; }

        .loading { text-align: center; padding: 30px; color: #888; }
        .loading .spinner { display: inline-block; width: 35px; height: 35px; border: 4px solid #333; border-top: 4px solid #00b894; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-data { text-align: center; padding: 30px; color: #888; font-size: 1em; }

        @media (max-width: 768px) {
            .sf2-controls { flex-direction: column; gap: 10px; }
            .sf2-controls > div { width: 100%; display: flex; justify-content: space-between; align-items: center; }
            .sf2-controls select { flex: 1; }
            .btn-generate, .btn-download { width: 100%; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .nav-bar a { padding: 7px 10px; font-size: 0.75em; }
        }

        @media (max-width: 480px) {
            .sf2-container { padding: 10px; }
            .sf2-table { font-size: 0.6em; }
            .sf2-table .student-name { min-width: 140px; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .summary-card { padding: 10px; }
            .summary-card .number { font-size: 1.2em; }
            .nav-bar { gap: 5px; padding: 10px; }
            .nav-bar a { padding: 6px 8px; font-size: 0.7em; }
            .signatures { flex-direction: column; align-items: center; }
        }
    </style>
</head>

        <div class="sf2-header">
