<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Attendance</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:820px;margin:32px auto;padding:20px}.panel{background:#fff;padding:22px;margin:16px 0;border-radius:12px;box-shadow:0 2px 10px #0001}button{padding:12px 20px}.msg{margin-left:10px}</style></head><body><main><h1>Student Attendance</h1><section class="panel"><h2 id="name">Loading…</h2><p>Use the button below to record your attendance. Allow location access when asked for onsite check-in.</p><button onclick="checkIn()">Record my attendance</button><span id="msg" class="msg"></span></section><section class="panel"><h2>Recent attendance</h2><table><thead><tr><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section><button onclick="logout()">Sign out</button></main><script>
const token=localStorage.getItem('token');if(!token)location.href='index.html';const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
async function load(){const r=await fetch('/api/student-account/me',{headers});if(!r.ok){logout();return}const d=await r.json();document.getElementById('name').textContent=d.student.full_name;document.getElementById('rows').innerHTML=d.records.map(x=>`<tr><td>${x.date}</td><td>${x.time_in||''}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="3">No records yet</td></tr>'}
async function checkIn(){const msg=document.getElementById('msg');msg.textContent='Getting location…';const cfg=await fetch('/api/settings',{headers}).then(r=>r.json());const send=async coords=>{const r=await fetch('/api/attendance/self',{method:'POST',headers,body:JSON.stringify(coords||{})});const d=await r.json();msg.textContent=r.ok?(d.duplicate?'Already recorded today at '+d.time_in:'Attendance recorded at '+d.time_in+' ('+d.status+')'):(d.error||'Could not record attendance');if(r.ok)load()};if(cfg.gps_enabled==='1'){if(!navigator.geolocation){msg.textContent='This browser does not support location access.';return}navigator.geolocation.getCurrentPosition(p=>send({latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>{msg.textContent='Location permission is required for onsite check-in.'},{enableHighAccuracy:true,timeout:15000})}else send({})}
function logout(){localStorage.clear();location.href='index.html'}load();</script></body></html>
